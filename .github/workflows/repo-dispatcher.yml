#=================================================
# 可选：通过此工作流间接启动 Build OpenWrt
# 推荐直接运行 Build OpenWrt 工作流
#=================================================

name: Repo Dispatcher

on: 
  workflow_dispatch:
    inputs:
      param:
        description: 'parameter (e.g. nocache, ssh)'
        required: false
        default: ''

permissions:
  actions: write
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Build OpenWrt (HC5962)
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'Openwrt-AutoBuild.yml',
            ref: context.ref,
            inputs: {
              target: 'ramips_mt7621',
              param: '${{ github.event.inputs.param }}'
            }
          });
          core.info('已触发 Build OpenWrt，请在 Actions 列表中查看编译进度');
